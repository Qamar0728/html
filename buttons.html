<!DOCTYPE html>
<head>
    <title>
        Buttons
    </title>
</head>
<style>
    .subscribe-button {
        background-color: rgb(196, 2, 2);
        color: white;
        border: none;
        height: 36px;
        width: 105px;
        border-radius: 2px;
        margin-right: 8px;
        transition: opacity 0.20s;
    }

    .subscribe-button:hover
    {
        opacity: 0.8;
    }
    .subscribe-button:active
    {
        opacity: 0.5;
    }
    .save-button {
        background-color: white;
        color: rgb(13, 109, 219);
        border-style: solid;
        border-width: 1px;
        font-weight: bold;
        font-size: 15px;
        border-radius: 18px;
        height: 36px;
        width: 62px;
        border-color: rgb(13, 109, 219);
        transition: opacity 0.25s;
     }
    
    .save-button:hover
    {
        opacity: 0.8
    }

    .save-button:active
    {
        opacity: 0.5
    }


</style>

<button class = "subscribe-button">
    SUBSCRIBE
</button>

<button class = "save-button">
    Save
</button>
